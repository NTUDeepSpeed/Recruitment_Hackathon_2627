# Track metadata for the NTU DeepSpeed Recruitment Hackathon 26/27 - Track 2.
#
# READ THIS FIRST: nothing in this file scores a run.
#
# On Track 2 the circuit lives inside the AutoDRIVE Simulator build. The
# simulator owns the start/finish line, counts the laps, times them and detects
# contact with the track boundary, and publishes all of it through the devkit
# bridge. The referee reads those numbers. It never opens a map.
#
# What this file is for:
#   * the track name that lands in your result JSON;
#   * pointing scripts/track_tool.py and roboracer_baselines/pure_pursuit at an
#     occupancy grid of the circuit, once one has been published, so you can
#     build a racing line or your own localisation against it.
#
# Fields (all optional except map_path)
#   map_path           absolute path inside the container, WITHOUT the
#                      extension. /hackathon is this repository, bind-mounted.
#   map_image_ext      image extension for the map (.pgm or .png)
#   simulator_build    the AutoDRIVE release this track ships in
#   start_pose         [x, y, theta] in the simulator's `world` frame - planning
#                      only, the simulator decides where the car spawns
#   finish_line        [[x1, y1], [x2, y2]] - planning only, used by
#                      track_tool.py to trace a closed lap
#   crossing_direction optional +1/-1; inferred from the start heading
#
# After the map is published, check the numbers against the image:
#     ./scripts/track_tool.py validate

default: icra26_compete

tracks:
  icra26_compete:
    description: >-
      The official circuit: the "compete" phase track of the RoboRacer Sim
      Racing League @ ICRA 2026, as shipped in the AutoDRIVE Simulator compete
      build. Roughly 30 x 10 m, bounded by 33 cm air ducts, at least three car
      widths (90 cm) wide throughout. You have never driven it and neither has
      anyone else.

    simulator_build: 2026-icra/compete

    # The occupancy grid is NOT part of the simulator download. It is published
    # separately by the organisers and dropped in here; until then this path
    # does not resolve and every tool that needs it says so and carries on.
    # The referee does not need it, so a scored run works either way.
    map_path: /hackathon/maps/icra26_compete
    map_image_ext: .pgm

    # Filled in when the map is published. Both are planning aids for
    # track_tool.py; the simulator spawns the car and defines the line.
    start_pose: null
    finish_line: null
