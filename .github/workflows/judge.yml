# Automated judging.
#
# Builds the official image, races whatever is in race_ws/src/team_driver, and
# writes the result to the workflow summary. On the template repository there
# is no entry to score - the template has no driving logic - so the checks run
# and the race is skipped.
#
# Nothing here decides the real result: judging day is a scored run on the
# machine in docs/05-evaluation.md. This is the same referee with the same
# settings, so a green run here means your entry will start on the day.

name: Judge

on:
  push:
    branches: [track1, main]
  pull_request:
    branches: [track1, main]
  workflow_dispatch:
    inputs:
      laps:
        description: "Scored laps per run"
        default: "10"
      runs:
        description: "Runs per driver, best counted"
        default: "1"

concurrency:
  group: judge-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: roboracer_track1
  LAPS: ${{ github.event.inputs.laps || '10' }}
  RUNS: ${{ github.event.inputs.runs || '1' }}

jobs:
  # ---------------------------------------------------------------------
  # Fast feedback. None of this needs Docker, so it fails in under a minute
  # when something is obviously wrong rather than 30 minutes into a build.
  # ---------------------------------------------------------------------
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: the integrity check below needs a merge base against
          # the official branch, which a depth-1 checkout cannot provide.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --quiet pyyaml

      - name: Referee rule tests
        run: python3 race_ws/src/roboracer_referee/test/test_session.py

      - name: Scoring tests
        run: python3 scripts/test_leaderboard.py

      - name: Track definition is valid
        run: ./scripts/track_tool.py validate

      - name: Judging environment is unmodified
        id: integrity
        run: |
          set -euo pipefail
          # A tampering failure is a disqualification, and a disqualification
          # has to say why. Left as a bare non-zero exit it shows up as a red
          # cross with the reason buried in a collapsed log, which reads like
          # the pipeline broke rather than like a ruling.
          if ./scripts/verify_judging_env.sh > "${RUNNER_TEMP:-/tmp}/integrity.txt" 2>&1; then
            cat "${RUNNER_TEMP:-/tmp}/integrity.txt"
            {
              echo "### Judging environment"
              echo
              echo "Intact. Nothing in the referee, the circuit, the image"
              echo "definition or the evaluation scripts has been changed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat "${RUNNER_TEMP:-/tmp}/integrity.txt"
          {
            echo "# DISQUALIFIED - judging environment modified"
            echo
            echo "> [!CAUTION]"
            echo "> This entry would **not be scored**. Rule 25 forbids changing the"
            echo "> judging environment, and rule 27 makes an entry that does so"
            echo "> ineligible. No race was run."
            echo
            echo "## What changed"
            echo
            echo '```'
            # Only the findings. The script's own recovery advice is indented
            # four spaces, the findings two, which is what separates them here.
            grep -E ': FAILED$|^  [^ ]' "${RUNNER_TEMP:-/tmp}/integrity.txt" \
              || cat "${RUNNER_TEMP:-/tmp}/integrity.txt"
            echo '```'
            echo
            echo "## How to fix it"
            echo
            echo "If this was accidental, restore the official files:"
            echo
            echo '```sh'
            echo "git checkout -- race_ws/src/roboracer_referee docker maps scripts install"
            echo "git submodule update --init --recursive"
            echo '```'
            echo
            echo "Then check it locally before pushing again:"
            echo
            echo '```sh'
            echo "./scripts/verify_judging_env.sh"
            echo '```'
            echo
            echo "If the change was deliberate, move it into"
            echo '`race_ws/src/team_driver/`, which is yours to edit. If you believe'
            echo "something in the judging environment is genuinely broken, raise it"
            echo "with the organisers rather than patching around it (rule 27)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # The step above compares against a manifest committed inside the entry.
      # That is useful to the team, but it cannot be the ruling: whoever submits
      # can re-run `verify_judging_env.sh --update`, or replace that script
      # outright, and both files travel with the submission. This step trusts
      # nothing in the checkout - it diffs the protected paths against the
      # official branch. Skipped on the official repository itself, where there
      # is nothing to compare against, and on pull requests, so that a report of
      # a genuine bug does not get a disqualification banner.
      - name: Judging environment matches the official branch
        if: github.event_name == 'push' && github.repository != 'NTUDeepSpeed/Recruitment_Hackathon_2627'
        run: |
          set -uo pipefail
          official=https://github.com/NTUDeepSpeed/Recruitment_Hackathon_2627.git
          branch=track1

          git remote add official "${official}" 2>/dev/null \
            || git remote set-url official "${official}"
          if ! git fetch --quiet --no-tags official "${branch}"; then
            echo "::warning::Could not reach the official repository; this check was skipped."
            exit 0
          fi

          # Compare against the fork point, not the tip. An entry that is simply
          # behind the official branch has not modified anything.
          base="$(git merge-base HEAD "official/${branch}" 2>/dev/null || true)"
          if [ -z "${base}" ]; then
            echo "::warning::No shared history with official/${branch}; comparing against its tip."
            base="official/${branch}"
          fi

          drift="$(git diff --name-status "${base}" HEAD -- race_ws/src/roboracer_referee docker .dockerignore maps scripts install .github/workflows)"
          if [ -z "${drift}" ]; then
            echo "Judging environment matches official/${branch} (base ${base:0:12})."
            exit 0
          fi

          echo "${drift}"
          {
            echo "# DISQUALIFIED - judging environment modified"
            echo
            echo "> [!CAUTION]"
            echo "> These files differ from the official \`${branch}\` branch. Re-signing"
            echo "> \`judging_manifest.sha256\` does not change this: the comparison is"
            echo "> against the official repository, not against anything in the entry."
            echo
            echo '```'
            echo "${drift}"
            echo '```'
            echo
            echo "Restore them, or move your work into \`race_ws/src/team_driver/\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Detect entry or template
        id: detect
        run: |
          set +e
          mode="$(./scripts/detect_submission.sh --explain)"
          status=$?
          set -e
          if [ "${status}" = "2" ]; then
            # Racing an unidentifiable tree is better than silently skipping a
            # real entry, so an ambiguous answer counts as a submission.
            echo "::warning::Could not tell an entry from the template; racing it anyway."
            mode="submission"
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "Mode: ${mode}"

          if [ "${mode}" != "submission" ]; then
            {
              echo "### No entry to race"
              echo
              echo "\`race_ws/src/team_driver\` is still the template, and the"
              echo "template does not drive - it holds a straight line into the"
              echo "first wall. There is nothing to score, so the race was"
              echo "skipped."
              echo
              echo "Edit \`race_ws/src/team_driver/team_driver/driver.py\` and this"
              echo "workflow will build the image and race your entry."
              echo
              echo "See [docs/04-algorithms.md](docs/04-algorithms.md) for where to start."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------
  # The race.
  # ---------------------------------------------------------------------
  judge:
    name: Race
    needs: checks
    # Nothing ships that can complete a lap, so there is no reference run to
    # fall back on: without an entry there is simply nothing to race.
    if: needs.checks.outputs.mode == 'submission'
    runs-on: ubuntu-latest
    # The image build is 15-30 minutes and each run is 11 laps of simulated
    # racing on a two-core runner, so this is generous on purpose.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --quiet pyyaml

      - name: Free up disk space
        # The image is large and a hosted runner starts with little headroom.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Race
        id: race
        run: |
          set -euo pipefail
          mkdir -p results

          # The container runs evaluate.sh natively - it detects that it is
          # already inside and skips the docker hop.
          echo "::group::Racing team_driver"
          docker run --rm \
            -v "${PWD}:/hackathon" \
            -e ROS_LOCALHOST_ONLY=1 \
            "${IMAGE_NAME}:ci" \
            /hackathon/scripts/evaluate.sh \
              --team "team_driver" \
              --driver-pkg "team_driver" \
              --driver-exec "driver" \
              --laps "${LAPS}" \
              --runs "${RUNS}" \
              --headless \
              --timeout 7200 \
              --wall-timeout 7200 \
            || echo "::warning::team_driver did not finish cleanly; see the log above."
          echo "::endgroup::"

          # The container writes as root through the bind mount.
          sudo chown -R "$(id -u):$(id -g)" results || true
          ls -la results/

      - name: Write the summary
        if: always()
        run: |
          set -euo pipefail
          if ! ls results/*.json >/dev/null 2>&1; then
            {
              echo "## No results"
              echo
              echo "> [!CAUTION]"
              echo "> No run produced a result file. The referee log in the *Race*"
              echo "> step says why - usually the driver failed to start, or the"
              echo "> workspace did not build."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "# Judging results"
            echo
            echo "Your entry, raced on \`icra26\` over ${LAPS} scored laps."
            echo
            ./scripts/leaderboard.py summarise results/ --markdown --title "Runs"
            echo
            echo "> [!NOTE]"
            echo "> Scores here are relative to this run only. The leaderboard is"
            echo "> computed across all teams on judging day - see"
            echo "> [docs/05-evaluation.md](docs/05-evaluation.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_number }}
          path: results/*.json
          if-no-files-found: warn
          retention-days: 30
